AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Clearbook Hyderabad - separate provider and customer access across three Lambda functions
Parameters:
  RepaymentAllocationsTable:
    Type: String
    Default: clearbook-repayment_allocations
    AllowedPattern: '[A-Za-z0-9_.-]{3,255}'
    Description: Existing repayment_allocations DynamoDB table; managed by scripts/create-table.py
  TransactionsTable:
    Type: String
    Default: clearbook-transactions
    AllowedPattern: '[A-Za-z0-9_.-]{3,255}'
    Description: Existing transactions DynamoDB table; managed by scripts/create-table.py
  CategoriesTable:
    Type: String
    Default: clearbook-categories
    AllowedPattern: '[A-Za-z0-9_.-]{3,255}'
    Description: Existing categories DynamoDB table; managed by scripts/create-table.py
  OrganizationsTable:
    Type: String
    Default: clearbook-organizations
    AllowedPattern: '[A-Za-z0-9_.-]{3,255}'
    Description: Dedicated provider organization registry
  UsersTable:
    Type: String
    Default: clearbook-users
    AllowedPattern: '[A-Za-z0-9_.-]{3,255}'
    Description: Dedicated provider user membership registry
  ClientsTable:
    Type: String
    Default: clearbook-clients
    AllowedPattern: '[A-Za-z0-9_.-]{3,255}'
    Description: Existing clients DynamoDB table; managed by scripts/create-table.py
  VendorsTable:
    Type: String
    Default: clearbook-vendors
    AllowedPattern: '[A-Za-z0-9_.-]{3,255}'
    Description: Existing vendors DynamoDB table; managed by scripts/create-table.py
  AccountsTable:
    Type: String
    Default: clearbook-accounts
    AllowedPattern: '[A-Za-z0-9_.-]{3,255}'
    Description: Existing accounts DynamoDB table; managed by scripts/create-table.py
  SuperAdminEmail:
    Type: String
    Default: ''
    AllowedPattern: '^$|[^\s@]+@[^\s@]+\.[^\s@]+'
    Description: Initial workspace super-admin email; set at deployment, no password is stored in the template
  AllowedOrigin:
    Type: String
    Default: https://main.d1cy6ym167mgbw.amplifyapp.com
    Description: Exact frontend origin, such as https://billing.example.com
    AllowedPattern: 'https://[^/]+|http://localhost(:[0-9]+)?|http://127\.0\.0\.1(:[0-9]+)?'
  CallbackUrl:
    Type: String
    Default: https://main.d1cy6ym167mgbw.amplifyapp.com/
    Description: Exact frontend callback URL, including trailing slash, such as https://billing.example.com/
    AllowedPattern: 'https://[^#]+|http://localhost(:[0-9]+)?/[^#]*|http://127\.0\.0\.1(:[0-9]+)?/[^#]*'
  CognitoDomainPrefix:
    Type: String
    Default: clearbook
    AllowedPattern: '[a-z0-9][a-z0-9-]{0,29}[a-z0-9]'
    Description: Login domain prefix; AWS account and region are appended for uniqueness
Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    CodeUri: backend/
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        DYNAMODB_TABLES: !Sub
          - '{"accounts":"${Accounts}","vendors":"${Vendors}","clients":"${Clients}","organizations":"${Organizations}","users":"${Users}","categories":"${Categories}","transactions":"${Transactions}","repayment_allocations":"${Allocations}"}'
          - Accounts: !Ref AccountsTable
            Vendors: !Ref VendorsTable
            Clients: !Ref ClientsTable
            Organizations: !Ref OrganizationsTable
            Users: !Ref UsersTable
            Categories: !Ref CategoriesTable
            Transactions: !Ref TransactionsTable
            Allocations: !Ref RepaymentAllocationsTable
        WORKSPACE_ID: clearbook
Conditions:
  HasSuperAdmin: !Not [!Equals [!Ref SuperAdminEmail, '']]
Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-users'
      UserPoolTier: LITE
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      UsernameAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false
      AutoVerifiedAttributes: [email]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7
  LedgerScope:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      Identifier: clearbook
      Name: Clearbook ledger
      Scopes:
        - ScopeName: ledger
          ScopeDescription: Access this workspace's accounts, vendors and transactions
  SuperAdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: SUPER_ADMIN
      Description: Software provider; customer ledger access is denied
      Precedence: 0
  SuperAdminUser:
    Type: AWS::Cognito::UserPoolUser
    Condition: HasSuperAdmin
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolId: !Ref UserPool
      Username: !Ref SuperAdminEmail
      MessageAction: SUPPRESS
      UserAttributes:
        - Name: email
          Value: !Ref SuperAdminEmail
        - Name: email_verified
          Value: 'true'
  SuperAdminMembership:
    Type: AWS::Cognito::UserPoolUserToGroupAttachment
    Condition: HasSuperAdmin
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: !Ref SuperAdminGroup
      Username: !Ref SuperAdminUser
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: LedgerScope
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: clearbook-browser
      GenerateSecret: false
      SupportedIdentityProviders: [COGNITO]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile, clearbook/ledger]
      CallbackURLs: [!Ref CallbackUrl, 'http://localhost:5173/', 'http://127.0.0.1:5173/']
      LogoutURLs: [!Ref CallbackUrl, 'http://localhost:5173/', 'http://127.0.0.1:5173/']
      DefaultRedirectURI: !Ref CallbackUrl
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 15
      IdTokenValidity: 15
      RefreshTokenValidity: 7
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub '${CognitoDomainPrefix}-${AWS::AccountId}-${AWS::Region}'
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin, 'http://localhost:5173', 'http://127.0.0.1:5173']
        AllowMethods: [GET, POST, PATCH, DELETE, OPTIONS]
        AllowHeaders: [Content-Type, Authorization, Idempotency-Key]
        MaxAge: 600
      Auth:
        DefaultAuthorizer: WorkspaceJwt
        Authorizers:
          WorkspaceJwt:
            IdentitySource: '$request.header.Authorization'
            AuthorizationScopes: [clearbook/ledger]
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
              audience: [!Ref UserPoolClient]
  ReferenceFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: reference_handler.handler
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPool
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:PutItem, dynamodb:DeleteItem]
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AccountsTable}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${VendorsTable}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ClientsTable}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${OrganizationsTable}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${UsersTable}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CategoriesTable}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TransactionsTable}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${RepaymentAllocationsTable}'
            - Effect: Allow
              Action: [cognito-idp:AdminCreateUser, cognito-idp:AdminGetUser, cognito-idp:AdminListGroupsForUser]
              Resource: !GetAtt UserPool.Arn
      Events:
        Session:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /api/session, Method: GET}
        ListCustomers:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /api/provider/customers, Method: GET}
        CreateCustomer:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /api/provider/customers, Method: POST}
        UpdateCustomer:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: '/api/provider/customers/{id}', Method: PATCH}
        DeleteCustomer:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: '/api/provider/customers/{id}', Method: DELETE}
        ListUsers:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /api/provider/users, Method: GET}
        CreateUser:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /api/provider/users, Method: POST}
        UpdateUser:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: '/api/provider/users/{id}', Method: PATCH}
        DeleteUser:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: '/api/provider/users/{id}', Method: DELETE}
        ListAccounts:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /api/accounts, Method: GET}
        CreateAccount:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /api/accounts, Method: POST}
        UpdateAccount:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: '/api/accounts/{id}', Method: PATCH}
        ListVendors:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /api/vendors, Method: GET}
        CreateVendor:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /api/vendors, Method: POST}
        UpdateVendor:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: '/api/vendors/{id}', Method: PATCH}
        ListClients:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /api/clients, Method: GET}
        CreateClient:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /api/clients, Method: POST}
        UpdateClient:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: '/api/clients/{id}', Method: PATCH}
        ListCategories:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /api/categories, Method: GET}
        CreateCategory:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /api/categories, Method: POST}
        ListLocations:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /api/locations, Method: GET}
        CreateLocation:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /api/locations, Method: POST}
  TransactionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: transactions_handler.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:PutItem, dynamodb:DeleteItem]
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AccountsTable}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${VendorsTable}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ClientsTable}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CategoriesTable}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TransactionsTable}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${RepaymentAllocationsTable}'
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Query]
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${OrganizationsTable}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${UsersTable}'
      Events:
        ListTransactions:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /api/transactions, Method: GET}
        CreateTransaction:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /api/transactions, Method: POST}
        UpdateTransaction:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: '/api/transactions/{id}', Method: PATCH}
        ReverseTransaction:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: '/api/transactions/{id}/reverse', Method: POST}
  DashboardFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dashboard_handler.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Query]
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AccountsTable}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${VendorsTable}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ClientsTable}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${OrganizationsTable}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${UsersTable}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CategoriesTable}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TransactionsTable}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${RepaymentAllocationsTable}'
      Events:
        Summary:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /api/dashboard, Method: GET}
Outputs:
  SuperAdminEmail:
    Value: !Ref SuperAdminEmail
  DynamoDbTableName:
    Description: Existing accounts table
    Value: !Ref AccountsTable
  AccountsTableName:
    Value: !Ref AccountsTable
  OrganizationsTableName:
    Value: !Ref OrganizationsTable
  UsersTableName:
    Value: !Ref UsersTable
  ClientsTableName:
    Value: !Ref ClientsTable
  VendorsTableName:
    Value: !Ref VendorsTable
  CategoriesTableName:
    Value: !Ref CategoriesTable
  TransactionsTableName:
    Value: !Ref TransactionsTable
  RepaymentAllocationsTableName:
    Value: !Ref RepaymentAllocationsTable
  ApiBaseUrl:
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com/api'
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  CognitoDomain:
    Value: !Sub 'https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com'
  AuthRedirectUri:
    Value: !Ref CallbackUrl
  AwsRegion:
    Value: !Ref AWS::Region
  ReferenceFunctionName:
    Value: !Ref ReferenceFunction
  TransactionsFunctionName:
    Value: !Ref TransactionsFunction
  DashboardFunctionName:
    Value: !Ref DashboardFunction
